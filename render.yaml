services:
  - type: web
    name: Stok-1
    env: python
    pythonVersion: "3.12"

    # Build: pip ve bağımlılıkların kurulumu
    buildCommand: |
      pip install --upgrade pip
      pip cache purge
      pip install --upgrade --force-reinstall google-generativeai
      pip install -r requirements.txt

    # PreRun: sistem bağımlılıkları, tesseract, zbar, statik dosyalar
    preRunCommand: |
      apt-get update
      apt-get install -y libpq-dev tesseract-ocr libtesseract-dev libleptonica-dev pkg-config ffmpeg libzbar0
      python manage.py collectstatic --noinput

    # Start: migration ve gunicorn
    startCommand: |
      python manage.py migrate --fake sayim 0004
      python manage.py migrate
      gunicorn stok_sayim.wsgi:application --bind 0.0.0.0:$PORT

    envVars:
      - key: PORT
        value: "10000"
      - key: DEBUG
        value: "False"
      - key: DJANGO_SETTINGS_MODULE
        value: "stok_sayim.settings"
      - key: GOOGLE_API_KEY
        value: "<YOUR_GOOGLE_KEY>"  # Gemini API için
